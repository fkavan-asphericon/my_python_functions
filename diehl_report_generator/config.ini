; Config file for Corss parser
[base]
xls_template = diehl_template.xlsm
xls_sheet = Frontlinse
headers = Seite, Position, Kategorie, Messwert, ID, Kommentar, Soll, Norm, Min, Max
first_row = 13
rowspacing = 2

[mapping Serial]
column = B
Seite = 0th
Kategorie = Allgemein
Messwert = /Teile-Nr./

[mapping Irregularity CC IRR]
column = I
Seite = 2nd
Kategorie = 3/
Messwert = B

[mapping Radius CC]
column = J
Seite = 2nd
Kategorie = 3/
Messwert = Radius

[mapping Power CC SAG]
column = K
Seite = 2nd
Kategorie = 3/
Messwert = A

[mapping Irregularity CX IRR]
column = L
Seite = 1st
Kategorie = 3/
Messwert = B

[mapping Radius CX]
column = M
Seite = 1st
Kategorie = 3/
Messwert = Radius

[mapping Power CX SAG]
column = N
Seite = 1st
Kategorie = 3/
Messwert = A

[mapping Centering Lens CX]
column = O
Seite = 1st
Kategorie = 4/
Messwert = ETV

[mapping Central Thickness]
column = P
Seite = 0th
Kategorie = Allgemein
Messwert = Mittendicke

[mapping Height]
column = Q
Seite = 0th
Kategorie = Allgemein
Messwert = Linsendicke

[mapping Runout Position AB chamfer]
column = R
Seite = 1st
Kategorie = 4/
Messwert = /Planlauf/

[mapping Runout Position AB hole]
column = S
Seite = 1st
Kategorie = Bohrung
Messwert = /Rundlauf/

[mapping Flatness lens]
column = T
Seite = 2nd
Kategorie = Geschliffene Fläche
Messwert = /Ebenheit/

[mapping Diameter]
column = U
Seite = 0th
Kategorie = Allgemein
Messwert = Durchmesser

[mapping Diameter hole chamfer]
column = V
Seite = 1st
Kategorie = Apertur
Messwert = Öffnungsdurchmesser

[mapping Diameter hole]
column = W
Seite = 0th
Kategorie = Bohrung
Messwert = Durchmesser

